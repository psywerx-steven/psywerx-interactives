name: Apply approved citation-only Topic Guides

on:
  push:
    branches: [feature/topic-guides-canonical-v1]
    paths:
      - '.github/topic-guides-remove-quotes.py'
      - '.github/workflows/topic-guides-remove-quotes.yml'

permissions:
  contents: read

jobs:
  remove-quotes:
    if: github.repository == 'psywerx-steven/psywerx-interactives' && github.ref == 'refs/heads/feature/topic-guides-canonical-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/topic-guides-canonical-v1
          persist-credentials: true
      - name: Apply approved narrow migration
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_SHA"
          test "$(git rev-parse HEAD^)" = '2fbcd3ed9553ed98062e77848aaea4c9d382e5be'
          python .github/topic-guides-remove-quotes.py .
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
      - name: Rebuild and run unit and regression tests
        run: |
          set -euo pipefail
          python scripts/build_topic_guides.py
          python scripts/build_topic_guides.py --check
          python -m unittest tests.cognitive_security.test_topic_guides tests.cognitive_security.test_explorer tests.cognitive_security.test_presentation_discovery tests.test_site_navigation -v 2>&1 | tee /tmp/topic-guides-unit-tests.log
          git diff --exit-code -- data/cognitive-security data/cognitive-security-discovery content/cognitive-security-guides/source_lock.json docs/cognitive-security/topic-guides/CROSSWALK.md
      - name: Check all fifteen guides in desktop and mobile browsers
        env:
          PSYWERX_GUIDE_SCREENSHOT_DIR: /tmp/psywerx-guide-screenshots
        run: |
          set -euo pipefail
          export PSYWERX_BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$PSYWERX_BROWSER_EXECUTABLE"
          python -m unittest tests.cognitive_security.test_topic_guides_browser -v 2>&1 | tee /tmp/topic-guides-browser-tests.log
      - name: Commit tested quote removal to feature branch
        run: |
          set -euo pipefail
          git add -u cognitive-security/topic content/cognitive-security-guides data/cognitive-security-guides docs/cognitive-security/topic-guides scripts/cognitive_security/topic_guides.py tests/cognitive_security/test_topic_guides.py tests/cognitive_security/test_topic_guides_browser.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove quotations from all Topic Guides while preserving cited content'
          git push origin HEAD:refs/heads/feature/topic-guides-canonical-v1
      - name: Prepare review files
        if: always()
        run: |
          mkdir -p /tmp/topic-guides-review
          git archive --format=tar HEAD > /tmp/topic-guides-review/repository.tar
          git rev-parse HEAD > /tmp/topic-guides-review/commit.txt
          cp /tmp/topic-guides-*-tests.log /tmp/topic-guides-review/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: citation-only-topic-guides-review
          path: |
            /tmp/topic-guides-review/
            /tmp/psywerx-guide-screenshots/
          retention-days: 7
          if-no-files-found: error
