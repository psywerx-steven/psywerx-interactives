name: Research feed ingest

on:
  push:
    branches: [main]
    paths:
      - 'data/research-stream/inbox/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-feed-ingest
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and ingest Daily Brief handoffs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/research-stream/inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No research handoff files found.'
            exit 0
          fi
          IFS=$'\n' sorted=($(printf '%s\n' "${files[@]}" | sort))
          unset IFS
          for file in "${sorted[@]}"; do
            echo "Ingesting $file"
            python homepage/tools/ingest_research_items.py --input "$file"
          done

      - name: Build research explorer
        run: python homepage/tools/build_research_explorer.py

      - name: Rebuild production homepage
        run: python homepage/tools/build_homepage.py --mode release --tool-links local --output .

      - name: Commit generated research stream and site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PSYWERX Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/research-stream homepage/docs/BUILD_MANIFEST.json research index.html assets robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Update PSYWERX research feed'
          git push
