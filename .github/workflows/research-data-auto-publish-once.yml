name: One-time research-data auto-publish migration

on:
  push:
    branches: [research-data]
    paths: ['.github/workflows/research-data-auto-publish-once.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-data
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sync auto-publish runtime from main and migrate canonical state
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- homepage/tools/research_stream.py homepage/schemas/psywerx-research-items-v1.schema.json
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('data/research-stream')
          paths=[root/'research_items.jsonl', *sorted((root/'archive').glob('*.jsonl'))]
          changed=0
          for path in paths:
              if not path.exists(): continue
              rows=[]
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  row=json.loads(line)
                  if row.get('streamDecision') == 'pending':
                      changed += 1
                      if row.get('sourceVerified') is True:
                          row['streamDecision']='publish'
                          row['decisionDate']=row['firstSeenBriefDate']
                          row['publishedAt']=row['firstSeenBriefDate']
                      else:
                          row['streamDecision']='hold'
                          row['decisionDate']=row['firstSeenBriefDate']
                          row['publishedAt']=None
                      row['reviewRequired']=False
                  rows.append(json.dumps(row, ensure_ascii=False, separators=(',',':')))
              path.write_text('\n'.join(rows)+('\n' if rows else ''), encoding='utf-8', newline='\n')
          print(f'migrated_pending={changed}')
          PY
          python homepage/tools/build_research_stream.py
          python homepage/tools/build_research_explorer.py
          python - <<'PY'
          from pathlib import Path
          import json
          pending=[]
          root=Path('data/research-stream')
          for path in [root/'research_items.jsonl', *sorted((root/'archive').glob('*.jsonl'))]:
              if not path.exists(): continue
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if line.strip() and json.loads(line).get('streamDecision') == 'pending': pending.append(f'{path}:{n}')
          if pending: raise SystemExit('canonical pending records remain: '+', '.join(pending[:20]))
          print('canonical_pending=0')
          PY
      - name: Commit research-data migration
        shell: bash
        run: |
          git config user.name 'PSYWERX Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add homepage/tools/research_stream.py homepage/schemas/psywerx-research-items-v1.schema.json data/research-stream
          git commit -m 'Activate automatic research publication on data branch' || exit 0
          git push origin research-data
