name: One-time auto-publish test and override fix

on:
  push:
    branches: [auto-publish-research]
    paths: ['.github/workflows/auto-publish-fix-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: auto-publish-research
          fetch-depth: 0
      - name: Fix auto-publish update semantics and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('homepage/tools/research_stream.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if existing["streamDecision"] != "pending":', 'if existing["streamDecision"] in ("hold", "reject"):')
          p.write_text(s,encoding='utf-8',newline='\n')

          t=Path('tests/test_research_stream.py')
          x=t.read_text(encoding='utf-8')
          x=x.replace('''    def test_existing_human_decision_is_preserved_on_material_repeat(self):\n        self.ingest(sample_handoff(brief_date="2026-09-06"))\n        item_id = stream.load_database(self.database)[0]["itemId"]\n        stream.review_item(self.database, item_id, "publish", "2026-09-07")\n        changed = sample_handoff(brief_date="2026-09-08", summary="A later brief supplies materially different wording that must not overwrite content associated with a prior explicit human publishing decision without review.")\n        report = self.ingest(changed)\n        record = stream.load_database(self.database)[0]\n        self.assertEqual(report["conflicts"], 1)\n        self.assertEqual(record["streamDecision"], "publish")\n        self.assertNotEqual(record["streamSummary"], changed["items"][0]["streamSummary"])\n        self.assertEqual(record["latestSeenBriefDate"], "2026-09-08")\n        self.assertTrue(record["reviewRequired"])''', '''    def test_explicit_hold_is_preserved_on_material_repeat(self):\n        self.ingest(sample_handoff(brief_date="2026-09-06"))\n        item_id = stream.load_database(self.database)[0]["itemId"]\n        stream.review_item(self.database, item_id, "hold", "2026-09-07")\n        changed = sample_handoff(brief_date="2026-09-08", summary="A later brief supplies materially different wording that must not overwrite an explicit human hold without review.")\n        report = self.ingest(changed)\n        record = stream.load_database(self.database)[0]\n        self.assertEqual(report["conflicts"], 1)\n        self.assertEqual(record["streamDecision"], "hold")\n        self.assertNotEqual(record["streamSummary"], changed["items"][0]["streamSummary"])\n        self.assertEqual(record["latestSeenBriefDate"], "2026-09-08")\n        self.assertTrue(record["reviewRequired"])''')
          x=x.replace('''        record = stream.load_database(self.database)[0]\n        self.assertEqual(record["streamDecision"], "publish")\n        self.assertFalse(record["reviewRequired"])''', '''        record = stream.load_database(self.database)[0]\n        self.assertEqual(record["streamDecision"], "hold")\n        self.assertFalse(record["reviewRequired"])''', 1)
          x=x.replace('self.assertTrue(all(record["decisionDate"] is not None for record in records if record["streamDecision"] != "pending"))', 'self.assertTrue(all(record["decisionDate"] is not None for record in records))')
          t.write_text(x,encoding='utf-8',newline='\n')

          schema=Path('homepage/schemas/psywerx-research-items-v1.schema.json')
          q=schema.read_text(encoding='utf-8').replace('"streamDecision": {"const": "pending"}', '"streamDecision": {"const": "publish"}')
          schema.write_text(q,encoding='utf-8',newline='\n')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'PSYWERX Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add homepage/tools/research_stream.py homepage/schemas/psywerx-research-items-v1.schema.json tests/test_research_stream.py
          git commit -m 'Finalize automatic research publication semantics'
          git push origin auto-publish-research
