name: PSYWERX Governance CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux governance and service validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Install scenario-service dependencies
        working-directory: scenario-service
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build deterministic homepage preview and release candidate
        run: |
          python homepage/tools/build_research_stream.py
          python homepage/tools/build_homepage.py --mode preview --tool-links preview
          python homepage/tools/build_homepage.py --mode release --tool-links local --output .

      - name: Verify generated homepage artifacts are byte-identical
        run: git diff --exit-code -- index.html assets data/research-stream homepage-preview homepage/docs/BUILD_MANIFEST.json robots.txt sitemap.xml

      - name: Run research-stream and homepage launch tests
        run: python -m unittest tests.test_research_stream tests.test_homepage_preview -v

      - name: Regenerate governed migration artifacts
        run: python scripts/build_migration_preview_v0_3.py

      - name: Verify generated artifacts are byte-identical
        run: git diff --exit-code -- data

      - name: Run migration governance and integrity tests
        run: python -m unittest discover -s tests -p "test_migration_v0_3.py"

      - name: Run Relationship and Intervention V1 tests
        run: python -m unittest discover -s tests -p "test_relationship_intervention_v1.py"

      - name: Run BIO-F01 candidate pilot tests
        run: python -m unittest discover -s tests -p "test_bio_f01_pilot.py"

      - name: Run BIO-F01 governance checkpoint tests
        run: python -m unittest discover -s tests -p "test_bio_f01_governance_001.py"

      - name: Run BIO-F01 activation checkpoint tests
        run: python -m unittest discover -s tests -p "test_bio_f01_activation_001.py"

      - name: Validate Relationship and Intervention V1 repository state
        run: python scripts/relationship_intervention_v1.py --validate-repository

      - name: Run Actions and Events contracts, compatibility and eligibility tests
        run: python -m unittest discover -s tests -p "test_actions_events_v1.py"

      - name: Run safe generalized Family inventory tests
        run: python -m unittest discover -s tests -p "test_audit_family.py"

      - name: Validate INF-F03 candidate-only scientific pilot
        run: python -m unittest discover -s tests -p "test_inf_f03_pilot.py"

      - name: Validate INF-F03 human governance checkpoint
        run: python -m unittest discover -s tests -p "test_inf_f03_governance_001.py"

      - name: Validate INF-F03 activation-readiness audit
        run: python -m unittest discover -s tests -p "test_inf_f03_activation_audit_001.py"

      - name: Validate INF-F03 partial activation checkpoint
        run: python -m unittest discover -s tests -p "test_inf_f03_activation_001.py"

      - name: Validate additive Actions and Events repository
        run: python scripts/actions_events_v1.py --validate-repository

      - name: Validate SOC-F07 candidate network pilot and protected science
        run: python -m unittest discover -s tests -p "test_soc_f07_pilot.py"

      - name: Validate SOC-F07 exact human governance and inactive materialization
        run: python -m unittest discover -s tests -p "test_soc_f07_governance_001.py"

      - name: Validate isolated synthetic Network State proposal
        run: python -m unittest discover -s tests -p "test_network_state_vnext.py"

      - name: Run eight-Layer synthetic structural pilot
        run: python scripts/actions_events_synthetic.py

      - name: Validate optional Network State contracts and synthetic failures
        run: python -m unittest discover -s tests -p "test_relational_state_v1.py"

      - name: Validate truthful backward-compatible source verification
        run: python -m unittest discover -s tests -p "test_source_verification_v1.py"

      - name: Validate incremental Psychological Layer candidate audit
        run: python -m unittest discover -s tests -p "test_psychological_layer*.py"

      - name: Validate Layer Scale-Up V2 process funnel, benchmark and readiness
        run: python -m unittest discover -s tests -p "test_layer_scale_up_v2*.py"

      - name: Validate refreshed remaining-Layer readiness
        run: python -m unittest discover -s tests -p "test_remaining_layer_readiness_v2.py"

      - name: Validate final Social / Institutional readiness and program status
        run: python -m unittest discover -s tests -p "test_final_two_layer_readiness.py"

      - name: Validate candidate-only Informational Layer V2 audit
        run: python -m unittest discover -s tests -p "test_informational_layer_v2.py"

      - name: Validate exact Informational governance materialization
        run: python -m unittest discover -s tests -p "test_informational_governance_materialization.py"

      - name: Validate read-only Informational activation closeout
        run: python -m unittest discover -s tests -p "test_informational_activation_closeout.py"

      - name: Validate candidate-only Biological Layer V2 audit
        run: python -m unittest discover -s tests -p "test_biological_layer_v2.py"

      - name: Validate exact Biological governance materialization
        run: python -m unittest discover -s tests -p "test_biological_governance_materialization.py"

      - name: Validate read-only Biological activation closeout
        run: python -m unittest discover -s tests -p "test_biological_activation_closeout.py"

      - name: Validate candidate-only Cultural Layer V2 audit
        run: python -m unittest discover -s tests -p "test_cultural_layer_v2.py"

      - name: Validate zero-materialization Cultural governance closeout
        run: python -m unittest discover -s tests -p "test_cultural_governance_closeout.py"

      - name: Validate candidate-only Physical / Environmental Layer V2 audit
        run: python -m unittest discover -s tests -p "test_physical_environmental_layer_v2.py"

      - name: Validate exact Physical / Environmental governance materialization
        run: python -m unittest discover -s tests -p "test_physical_environmental_governance_materialization.py"

      - name: Validate read-only Physical / Environmental activation audit
        run: python -m unittest discover -s tests -p "test_physical_environmental_activation_audit.py"

      - name: Validate candidate-only Technological Layer V2 audit
        run: python -m unittest discover -s tests -p "test_technological_layer_v2.py"

      - name: Validate candidate-only Social Layer V2 audit
        run: python -m unittest discover -s tests -p "test_social_layer_v2.py"

      - name: Verify Social Layer candidate source identities
        run: python scripts/verify_social_layer_sources.py

      - name: Validate completed Institutional / Structural Layer V2 audit
        run: python -m unittest discover -s tests -p "test_institutional_structural_layer_v2.py"

      - name: Verify Institutional / Structural candidate source identities
        run: python scripts/verify_institutional_structural_layer_sources.py

      - name: Validate final eight-Layer checkpoint and blocker backlog
        run: python -m unittest discover -s tests -p "test_layer_scale_up_final_closeout.py"

      - name: Validate dependency-normalized post-scale-up governance roadmap
        run: python -m unittest discover -s tests -p "test_post_scale_up_governance_roadmap.py"

      - name: Validate read-only RDS contract decision test
        run: python -m unittest discover -s tests -p "test_rds_contract_decision_test.py"

      - name: Validate non-production RDS computation reference implementation
        run: python -m unittest discover -s tests -p "test_rds_computation_prototype.py"

      - name: Validate governed RDS-0006 Phase 1 shadow compatibility
        run: python -m unittest discover -s tests -p "test_rds_computation_v1.py"

      - name: Validate exact Technological governance materialization
        run: python -m unittest discover -s tests -p "test_technological_governance_materialization.py"

      - name: Validate read-only Technological activation audit
        run: python -m unittest discover -s tests -p "test_technological_activation_audit_001.py"

      - name: Validate Physical / Environmental activation blocker closeout
        run: python -m unittest discover -s tests -p "test_physical_environmental_activation_blocker_001.py"

      - name: Verify deterministic Biological Layer registries
        run: |
          python scripts/biological_layer_v2_curate.py
          python scripts/biological_layer_v2_adjudicate.py
          python scripts/biological_layer_v2_skeptical.py
          python scripts/biological_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/BIOLOGICAL_LAYER docs/governance/scale-up/BIOLOGICAL_LAYER

      - name: Verify deterministic Cultural Layer registries
        run: |
          python scripts/cultural_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/CULTURAL_LAYER docs/governance/scale-up/CULTURAL_LAYER

      - name: Verify deterministic Physical / Environmental Layer registries
        run: |
          python scripts/physical_environmental_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/PHYSICAL_ENVIRONMENTAL_LAYER docs/governance/scale-up/PHYSICAL_ENVIRONMENTAL_LAYER

      - name: Verify deterministic Technological Layer registries
        run: |
          python scripts/technological_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/TECHNOLOGICAL_LAYER docs/governance/scale-up/TECHNOLOGICAL_LAYER

      - name: Verify deterministic Social Layer registries
        run: |
          python scripts/social_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/SOCIAL_LAYER docs/governance/scale-up/SOCIAL_LAYER

      - name: Verify deterministic Institutional / Structural Layer registries
        run: |
          python scripts/institutional_structural_layer_v2_package.py
          git diff --exit-code -- data/candidates/actions-events-v1/INSTITUTIONAL_STRUCTURAL_LAYER docs/governance/scale-up/INSTITUTIONAL_STRUCTURAL_LAYER

      - name: Verify deterministic final program checkpoint
        run: |
          python scripts/layer_scale_up_final_closeout.py
          git diff --exit-code -- docs/governance/LAYER_SCALE_UP_PROGRAM_STATUS.md docs/governance/LAYER_SCALE_UP_FINAL_COMPLETENESS.md docs/governance/POST_SCALE_UP_BLOCKER_BACKLOG.md reports/layer-scale-up-v2/layer-scale-up-program-status.json reports/layer-scale-up-v2/layer-scale-up-final-completeness.json reports/layer-scale-up-v2/post-scale-up-blocker-backlog.json

      - name: Verify deterministic post-scale-up governance roadmap
        run: |
          python scripts/post_scale_up_governance_roadmap.py
          git diff --exit-code -- data/governance/post-scale-up docs/governance/post-scale-up

      - name: Verify deterministic RDS contract decision test
        run: |
          python scripts/rds_contract_decision_test.py
          git diff --exit-code -- data/governance/post-scale-up/rds docs/governance/post-scale-up/rds

      - name: Verify deterministic RDS reference package and migration dry run
        run: |
          python prototypes/rds-computation-v1/build_reference_package.py
          git diff --exit-code -- prototypes/rds-computation-v1 data/governance/post-scale-up/rds docs/governance/post-scale-up/rds data/governance/post-scale-up/work-packages.json

      - name: Verify deterministic RDS-0006 computation registries
        run: |
          python scripts/materialize_rds_computation_phase1.py
          python scripts/rds_computation_v1.py --validate-repository
          git diff --exit-code -- schemas/rds-computation-profile.schema.json schemas/rds-application-binding.schema.json schemas/rds-execution-request.schema.json schemas/rds-execution-provenance.schema.json schemas/rds-execution-eligibility.schema.json data/rds-computation-v1 data/governance/post-scale-up/rds/rds-0006-phase1-compatibility.json

      - name: Verify deterministic Informational Layer registries
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import informational_layer_v2 as m; m.build_reviews_and_coverage(); m.build_governance(); m.finalize()"
          git diff --exit-code -- data/candidates/actions-events-v1/INFORMATIONAL_LAYER docs/governance/scale-up/INFORMATIONAL_LAYER

      - name: Validate exact inactive SOC-F07 conditional completion
        run: python -m unittest discover -s tests -p "test_soc_f07_completion.py"

      - name: Validate collection catalog and deterministic Network State reports
        run: python scripts/network_state_integrity.py

      - name: Verify migration tests leave artifacts unchanged
        run: git diff --exit-code -- data

      - name: Run scenario-service contract tests
        working-directory: scenario-service
        run: npm test

      - name: Compile Python code
        run: python -m compileall -q scripts tests homepage/tools experiments/network-state-vnext

      - name: Parse JavaScript
        shell: bash
        run: git ls-files -z -- '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n 1 node --check

