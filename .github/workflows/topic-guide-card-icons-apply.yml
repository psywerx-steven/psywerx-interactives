name: Apply approved Topic Guide card artwork

on:
  push:
    branches: [feature/topic-guide-card-icons]
    paths:
      - '.github/topic-guide-card-art/**'
      - '.github/topic-guide-card-icons.patch'
      - '.github/workflows/topic-guide-card-icons-apply.yml'

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'psywerx-steven/psywerx-interactives' && github.ref == 'refs/heads/feature/topic-guide-card-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/topic-guide-card-icons
          fetch-depth: 2
          persist-credentials: true
      - name: Verify approved artwork and apply narrow presentation patch
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_SHA"
          test "$(git rev-parse HEAD^)" = 'dd8f57f3d67d57d8d377a764cf1054947aa419d3'
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/topic-guide-card-art').glob('part-*.b64'))
          assert len(parts) == 3
          raw = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert len(raw) == 31084
          assert hashlib.sha256(raw).hexdigest() == 'ec6bb1b3d689cc258d67397f4bfb6219ed8cfead7711679ee95ca25d6d014403'
          patch = pathlib.Path('.github/topic-guide-card-icons.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '8d56a1befbbaf16b9faf0943762c97d7ebbe6d25b705b43092b00afb9e194e31'
          expected = {'scripts/cognitive_security/topic_guides.py','cognitive-security/topic/guides.css','tests/cognitive_security/test_topic_guides_icons.py','tests/cognitive_security/test_topic_guides_browser.py','.github/workflows/topic-guides-validation.yml','docs/cognitive-security/topic-guides/ICONS.md'}
          stat = subprocess.check_output(['git','apply','--numstat',str(patch)],text=True)
          assert {line.split('\t',2)[2] for line in stat.splitlines()} == expected
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          pathlib.Path('cognitive-security/topic/topic-icons.webp').write_bytes(raw)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
      - name: Build and validate without changing corpus data
        run: |
          set -euo pipefail
          python scripts/build_topic_guides.py
          python scripts/build_topic_guides.py --check
          python -m unittest tests.cognitive_security.test_topic_guides tests.cognitive_security.test_topic_guides_icons tests.cognitive_security.test_explorer tests.cognitive_security.test_presentation_discovery tests.test_site_navigation -v 2>&1 | tee /tmp/topic-guide-icons-unit.log
          git diff --exit-code -- data content/cognitive-security-guides docs/cognitive-security/topic-guides/CROSSWALK.md
      - name: Check desktop and mobile card rendering
        env:
          PSYWERX_GUIDE_SCREENSHOT_DIR: /tmp/psywerx-guide-screenshots
        run: |
          set -euo pipefail
          export PSYWERX_BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$PSYWERX_BROWSER_EXECUTABLE"
          python -m unittest tests.cognitive_security.test_topic_guides_browser -v 2>&1 | tee /tmp/topic-guide-icons-browser.log
      - name: Commit tested artwork and remove temporary transport
        run: |
          set -euo pipefail
          git add scripts/cognitive_security/topic_guides.py cognitive-security/topic/guides.css cognitive-security/topic/topic-icons.webp cognitive-security/topic/index.html tests/cognitive_security/test_topic_guides_icons.py tests/cognitive_security/test_topic_guides_browser.py .github/workflows/topic-guides-validation.yml docs/cognitive-security/topic-guides/ICONS.md docs/cognitive-security/topic-guides/BUILD_REPORT.json
          git rm .github/topic-guide-card-art/part-01.b64 .github/topic-guide-card-art/part-02.b64 .github/topic-guide-card-art/part-03.b64 .github/topic-guide-card-icons.patch .github/workflows/topic-guide-card-icons-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved PSYWERX icons to all 15 Topic Guide cards'
          git push origin HEAD:refs/heads/feature/topic-guide-card-icons
      - name: Save public review artifacts
        if: always()
        run: |
          mkdir -p /tmp/topic-guide-icons-review
          git archive --format=tar HEAD > /tmp/topic-guide-icons-review/repository.tar
          git rev-parse HEAD > /tmp/topic-guide-icons-review/commit.txt
          cp /tmp/topic-guide-icons-*.log /tmp/topic-guide-icons-review/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: topic-guide-card-icons-review
          path: |
            /tmp/topic-guide-icons-review/
            /tmp/psywerx-guide-screenshots/
          retention-days: 7
          if-no-files-found: error
