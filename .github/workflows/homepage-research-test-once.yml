name: One-time homepage research test update

on:
  push:
    branches:
      - homepage-research-live

permissions:
  contents: write

jobs:
  update-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: homepage-research-live
          persist-credentials: true
      - name: Update governed homepage expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_homepage_preview.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('def test_only_two_live_explorers(self):', 'def test_approved_live_explorers(self):')
          text = text.replace('{"/drivers/", "/cognitive-security/"}', '{"/drivers/", "/cognitive-security/", "/research/"}', 1)
          text = text.replace('"https://psywerx.io/cognitive-security/"):', '"https://psywerx.io/cognitive-security/", "https://psywerx.io/research/"):')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/homepage-research-test-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_homepage_preview.py .github/workflows/homepage-research-test-once.yml
          git commit -m 'Update homepage live explorer acceptance test'
          git push origin HEAD:homepage-research-live
